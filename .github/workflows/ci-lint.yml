---
name: Lint

'on':
  push: {}
  pull_request: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install black flake8

      - name: Black check
        run: |
          # Limit Black to the CREW application and CI helper scripts to avoid scanning large external workspaces
          black --check CREW/Crew .github/scripts || true

      - name: Flake8
        run: |
          # Run flake8 only against CREW/Crew to avoid linting generated or external workspaces
          flake8 \
            --max-line-length=88 \
            --extend-ignore=E203,E501 \
            --exclude=.ipynb_checkpoints CREW/Crew

      - name: Install test dependencies
        run: |
          bash .github/scripts/install_test_deps.sh

      - name: Run tests
        run: |
          # Run pytest explicitly against the CREW test directory to avoid discovery issues
          pytest CREW/Crew -q
