name: Lint

on:
  push: {}
  pull_request: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install black flake8

      - name: Black check
        run: |
          black --check .

      - name: Flake8
        run: |
          flake8 --max-line-length=88 --extend-ignore=E203,E501 .
