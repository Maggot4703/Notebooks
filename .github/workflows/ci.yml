name: CI

on:
  push:
  pull_request:

jobs:
  test-crew:
    name: Run CREW tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Remove accidental gitlinks
        run: |
          git ls-files -s | awk '$1=="160000"{print $4}' | xargs -r git rm --cached -r || true
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev build-essential
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f CREW/Crew/requirements.txt ]; then pip install -r CREW/Crew/requirements.txt; fi
          # Ensure pytest is available in the runner
          python -m pip install pytest
      - name: Run pytest for CREW
        run: |
          cd CREW/Crew
          pytest -q
