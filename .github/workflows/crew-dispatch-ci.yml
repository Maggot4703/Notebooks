name: Crew Dispatch CI

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version'
        default: '3.14'
        required: false

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ github.event.inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f CREW/Crew/requirements.txt ]; then pip install -r CREW/Crew/requirements.txt; fi

      - name: Run pytest in CREW/Crew
        working-directory: CREW/Crew
        run: |
          pytest -q || (echo "Pytest failed; exit code $?"; exit 1)

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crew-pytest-results
          path: CREW/Crew/**/test-*.xml || true
