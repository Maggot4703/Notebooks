name: E2E Tests

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip pytest requests playwright
          playwright install --with-deps
      - name: Start server
        run: |
          python src/public_html/server.py &
          sleep 1
      - name: Wait for server
        run: |
          for i in {1..10}; do curl -sSf http://127.0.0.1:8080/index.html && break || sleep 1; done
      - name: Run E2E tests
        run: pytest -q e2e
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/*
          retention-days: 7

  comment_artifacts:
    needs: e2e
    runs-on: ubuntu-latest
    if: ${{ needs.e2e.result == 'failure' && github.event_name == 'pull_request' }}
    steps:
      - name: Comment PR with artifact link
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run_id = context.runId;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id });
            const art = artifacts.data.artifacts.find(a => a.name === 'e2e-artifacts');
            if (!art) {
              core.info('No e2e-artifacts found');
              return;
            }
            const url = `https://github.com/${owner}/${repo}/suites/${run_id}/artifacts/${art.id}`;
            const pr = context.payload.pull_request.number;
            const body = `E2E artifacts for failing run: ${url}`;
            await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
